<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="light-content">
<meta name="apple-mobile-web-app-title" content="Mis Comidas">
<title>Mis Comidas</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%235a7a52'/%3E%3Ccircle cx='90' cy='72' r='32' fill='%23b8d4b0'/%3E%3Cellipse cx='90' cy='130' rx='42' ry='22' fill='%23b8d4b0'/%3E%3Ccircle cx='90' cy='68' r='22' fill='%23f9f6f0'/%3E%3Ctext x='90' y='76' text-anchor='middle' font-size='26' font-family='system-ui' fill='%235a7a52'%3E🌿%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235a7a52'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='18' font-family='system-ui'%3E🌿%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#5a7a52">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --sage:#5a7a52;--sage-mid:#7a9e70;--sage-light:#b8d4b0;--sage-pale:#eaf3e7;
  --sage-ultra:#f4faf2;
  --warm:#f9f6f0;--warm-dark:#ede8df;--warm-deeper:#ddd6c8;
  --text:#1c1c1e;--text-sec:#6b6b6b;--text-ter:#adadad;
  --card:#ffffff;--card-border:rgba(0,0,0,.07);
  --orange:#d4622a;--orange-pale:#fdf0e8;
  --blue:#2c6fad;--blue-pale:#e8f0f9;
  --red:#c0392b;
  --rad:18px;--rad-sm:12px;--rad-xs:8px;
  --sh:0 2px 12px rgba(0,0,0,.06);--shm:0 8px 32px rgba(0,0,0,.12);
  --font:'Nunito',system-ui,sans-serif;
}
html{background:var(--warm);}
body{font-family:var(--font);background:var(--warm);color:var(--text);padding-bottom:100px;-webkit-font-smoothing:antialiased;overscroll-behavior:none;min-height:100vh;}

/* ─── HEADER ─── */
.app-header{
  background:linear-gradient(160deg,var(--sage) 0%,var(--sage-mid) 100%);
  padding:52px 22px 24px;
  position:relative;overflow:hidden;
}
.app-header::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.12) 0%,transparent 60%);
}
.app-header h1{font-size:28px;font-weight:800;color:#fff;letter-spacing:-.5px;position:relative;}
.app-header p{font-size:13px;color:rgba(255,255,255,.72);margin-top:3px;font-weight:500;position:relative;}
.header-pill{
  position:absolute;right:20px;top:54px;
  background:rgba(255,255,255,.18);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.25);
  border-radius:99px;padding:6px 14px;
  display:flex;gap:4px;
}
.hpill-btn{
  border:none;background:none;color:rgba(255,255,255,.65);
  font-family:var(--font);font-size:12px;font-weight:700;
  padding:4px 10px;border-radius:99px;cursor:pointer;transition:.2s;
}
.hpill-btn.act{background:rgba(255,255,255,.92);color:var(--sage);}

/* ─── PROGRESO HEADER ─── */
.prog-strip{
  background:var(--sage);padding:10px 22px 16px;
  display:flex;align-items:center;gap:14px;
}
.prog-bar-wrap{flex:1;height:4px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;}
.prog-bar-fill{height:100%;background:#fff;border-radius:99px;transition:.5s;}
.prog-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.8);white-space:nowrap;}

/* ─── BOTTOM NAV ─── */
.bnav{
  position:fixed;bottom:0;left:0;right:0;z-index:500;
  background:rgba(255,255,255,.92);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,0,0,.06);
  padding:10px 20px 28px;
  display:flex;gap:0;
}
.bnav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:none;background:none;cursor:pointer;font-family:var(--font);
  padding:6px 4px;border-radius:12px;transition:.15s;
}
.bnav-ico{font-size:22px;line-height:1;}
.bnav-lbl{font-size:10px;font-weight:700;color:var(--text-ter);letter-spacing:.2px;}
.bnav-btn.act .bnav-ico{filter:none;}
.bnav-btn.act .bnav-lbl{color:var(--sage);}
.bnav-dot{width:5px;height:5px;border-radius:50%;background:var(--sage);margin-top:2px;opacity:0;}
.bnav-btn.act .bnav-dot{opacity:1;}

/* ─── PANELS ─── */
.panel{display:none;padding:16px 16px 0;}
.panel.act{display:block;}

/* ─── SEMANA HEADER ─── */
.semana-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.semana-title{font-size:20px;font-weight:800;color:var(--text);}

/* ─── DIA ACCORDION ─── */
.dia-card{
  background:var(--card);border-radius:var(--rad);
  box-shadow:var(--sh);border:1px solid var(--card-border);
  margin-bottom:10px;overflow:hidden;
}
.dia-header{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;cursor:pointer;
  transition:background .15s;
  -webkit-user-select:none;user-select:none;
}
.dia-header:active{background:var(--sage-ultra);}
.dia-num{
  width:40px;height:40px;border-radius:12px;
  background:var(--sage-pale);color:var(--sage);
  font-size:16px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.dia-num.completo{background:var(--sage);color:#fff;}
.dia-info{flex:1;}
.dia-nombre{font-size:15px;font-weight:700;}
.dia-sub{font-size:11px;color:var(--text-sec);margin-top:1px;}
.dia-chevron{font-size:13px;color:var(--text-ter);transition:transform .25s;font-weight:700;}
.dia-card.open .dia-chevron{transform:rotate(90deg);}
.dia-progress{display:flex;gap:4px;margin-top:5px;}
.dia-dot{width:6px;height:6px;border-radius:50%;background:var(--warm-dark);}
.dia-dot.done{background:var(--sage);}

/* ─── COMIDAS DENTRO DEL DIA ─── */
.dia-body{display:none;border-top:1px solid var(--warm-dark);}
.dia-card.open .dia-body{display:block;}
.comida-row{
  display:flex;align-items:stretch;gap:0;
  border-bottom:1px solid var(--warm-dark);
  cursor:pointer;transition:background .15s;
}
.comida-row:last-child{border-bottom:none;}
.comida-row:active{background:var(--sage-ultra);}
.comida-row.done{opacity:.5;}
.comida-tipo-bar{width:4px;flex-shrink:0;}
.comida-tipo-bar.desayuno{background:var(--orange);}
.comida-tipo-bar.cena{background:var(--blue);}
.comida-content{flex:1;padding:12px 14px;}
.comida-tipo-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px;}
.comida-tipo-label.desayuno{color:var(--orange);}
.comida-tipo-label.cena{color:var(--blue);}
.comida-nombre{font-size:13px;font-weight:600;line-height:1.35;color:var(--text);}
.comida-row.done .comida-nombre{text-decoration:line-through;color:var(--text-ter);}
.comida-tip{font-size:11px;color:var(--text-sec);margin-top:3px;line-height:1.4;}
.comida-actions{display:flex;align-items:center;gap:8px;padding:12px 14px 12px 0;flex-shrink:0;}
.btn-receta-pill{
  background:var(--sage-pale);color:var(--sage);
  border:none;border-radius:99px;padding:5px 10px;
  font-family:var(--font);font-size:10px;font-weight:700;
  cursor:pointer;white-space:nowrap;
}
.btn-check{
  width:26px;height:26px;border-radius:50%;
  border:2px solid var(--warm-deeper);background:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#fff;transition:.15s;flex-shrink:0;
}
.btn-check.done{background:var(--sage);border-color:var(--sage);}

/* ─── MODAL RECETA (sheet) ─── */
#modal-overlay{
  position:fixed;inset:0;z-index:800;
  background:rgba(0,0,0,.4);
  display:none;align-items:flex-end;
}
#modal-overlay.open{display:flex;}
.sheet{
  background:var(--warm);width:100%;
  border-radius:26px 26px 0 0;
  max-height:90vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:40px;
  animation:slideUp .3s cubic-bezier(.32,1,.23,1);
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-handle{width:36px;height:4px;background:rgba(0,0,0,.12);border-radius:99px;margin:12px auto 0;}
.sheet-header{padding:16px 20px 12px;display:flex;align-items:flex-start;gap:12px;}
.sheet-emoji{font-size:36px;flex-shrink:0;line-height:1;}
.sheet-titulo{flex:1;}
.sheet-titulo h2{font-size:19px;font-weight:800;line-height:1.2;}
.sheet-titulo p{font-size:11px;color:var(--text-sec);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.btn-close-sheet{
  width:30px;height:30px;border-radius:50%;
  background:var(--warm-dark);border:none;cursor:pointer;
  font-size:15px;color:var(--text-sec);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.sheet-divider{height:1px;background:var(--warm-dark);margin:0 20px;}
.sheet-section{padding:16px 20px 0;}
.sheet-section-title{
  font-size:10px;font-weight:800;text-transform:uppercase;
  letter-spacing:1px;color:var(--text-ter);margin-bottom:10px;
}
.ing-grid{display:flex;flex-direction:column;gap:6px;}
.ing-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 12px;background:var(--card);border-radius:var(--rad-xs);
  border:1px solid var(--card-border);
}
.ing-nombre{font-size:13px;font-weight:600;}
.ing-qty{font-size:12px;font-weight:700;color:var(--sage);}
.steps-list{display:flex;flex-direction:column;gap:10px;}
.step-row{display:flex;gap:10px;align-items:flex-start;}
.step-num-circle{
  width:26px;height:26px;border-radius:50%;
  background:var(--sage);color:#fff;
  font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
}
.step-text{font-size:13px;line-height:1.55;color:var(--text);}
.conserva-card{
  background:linear-gradient(135deg,var(--sage-pale),#fff);
  border:1px solid var(--sage-light);border-radius:var(--rad-sm);
  padding:14px;font-size:13px;line-height:1.6;color:var(--text);
}
.conserva-card strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--sage);font-weight:800;margin-bottom:6px;}

/* ─── COMPRAS ─── */
.compras-hero{
  background:linear-gradient(135deg,var(--sage-pale),#fff);
  border:1px solid var(--sage-light);border-radius:var(--rad);
  padding:16px;margin-bottom:14px;
  display:flex;justify-content:space-around;
}
.ch-stat{text-align:center;}
.ch-num{font-size:26px;font-weight:800;color:var(--sage);display:block;}
.ch-lbl{font-size:10px;font-weight:700;color:var(--text-sec);text-transform:uppercase;letter-spacing:.5px;}
.compra-seccion{margin-bottom:16px;}
.compra-sec-title{
  font-size:11px;font-weight:800;text-transform:uppercase;
  letter-spacing:.8px;color:var(--sage);
  padding:0 4px;margin-bottom:8px;
  display:flex;align-items:center;gap:8px;
}
.compra-sec-title::after{content:'';flex:1;height:1.5px;background:var(--sage-light);}
.compra-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;background:var(--card);border-radius:var(--rad-sm);
  border:1px solid var(--card-border);box-shadow:var(--sh);
  margin-bottom:7px;transition:opacity .2s;cursor:pointer;
}
.compra-item.done{opacity:.38;}
.compra-item.done .ci-nombre{text-decoration:line-through;color:var(--text-ter);}
.ci-chk{
  width:24px;height:24px;border-radius:50%;
  border:2px solid var(--warm-deeper);background:none;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#fff;flex-shrink:0;transition:.15s;
}
.ci-chk.done{background:var(--sage);border-color:var(--sage);}
.ci-nombre{font-size:14px;font-weight:600;flex:1;}
.ci-qty{font-size:11px;color:var(--text-sec);font-weight:500;}

/* ─── TOAST ─── */
#toast{
  position:fixed;bottom:110px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:rgba(30,30,30,.92);backdrop-filter:blur(12px);
  color:#fff;padding:10px 22px;border-radius:99px;
  font-size:13px;font-weight:600;opacity:0;
  transition:all .25s cubic-bezier(.32,1,.23,1);
  z-index:9999;pointer-events:none;white-space:nowrap;
  font-family:var(--font);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.ok{background:var(--sage);}


/* ─── PREP ─── */
.prep-hero{background:linear-gradient(135deg,#fff8ee,#fff);border:1px solid #f0d9b5;border-radius:var(--rad);padding:16px 18px;margin-bottom:14px;}
.prep-hero-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.prep-hero-ico{font-size:36px;}
.prep-hero-txt h2{font-size:18px;font-weight:800;color:var(--text);}
.prep-hero-txt p{font-size:12px;color:var(--text-sec);margin-top:2px;line-height:1.4;}
.prep-tiempo-row{display:flex;gap:8px;flex-wrap:wrap;}
.prep-tiempo-chip{background:#fff;border:1px solid #f0d9b5;border-radius:99px;padding:5px 12px;font-size:11px;font-weight:700;color:#a0622a;}
.prep-prog-wrap{background:linear-gradient(135deg,var(--sage-pale),#fff);border:1px solid var(--sage-light);border-radius:var(--rad-sm);padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px;}
.prep-prog-bar-wrap{flex:1;height:6px;background:var(--warm-dark);border-radius:99px;overflow:hidden;}
.prep-prog-fill{height:100%;background:var(--sage);border-radius:99px;transition:.4s;}
.prep-prog-txt{font-size:12px;font-weight:700;color:var(--sage);white-space:nowrap;}
.prep-reset{border:none;background:var(--warm-dark);color:var(--text-sec);border-radius:99px;padding:6px 14px;font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer;}
.prep-task{background:var(--card);border-radius:var(--rad-sm);border:1px solid var(--card-border);box-shadow:var(--sh);margin-bottom:8px;overflow:hidden;transition:opacity .2s;}
.prep-task.done-task{opacity:.42;}
.prep-task-header{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;}
.prep-task-header:active{background:var(--sage-ultra);}
.prep-order{width:32px;height:32px;border-radius:10px;background:#fff8ee;border:2px solid #f0d9b5;color:#a0622a;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;}
.prep-task.done-task .prep-order{background:var(--sage);border-color:var(--sage);color:#fff;}
.prep-task-info{flex:1;}
.prep-task-nombre{font-size:14px;font-weight:700;line-height:1.2;}
.prep-task.done-task .prep-task-nombre{text-decoration:line-through;color:var(--text-ter);}
.prep-task-meta{font-size:11px;color:var(--text-sec);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;}
.prep-meta-chip{background:var(--warm-dark);border-radius:99px;padding:2px 8px;font-weight:700;}
.prep-meta-chip.congelar{background:#e8f0f9;color:var(--blue);}
.prep-meta-chip.refri{background:var(--sage-pale);color:var(--sage);}
.prep-meta-chip.listo{background:#fff8ee;color:#a0622a;}
.prep-chk-btn{width:26px;height:26px;border-radius:50%;border:2px solid var(--warm-deeper);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0;transition:.15s;}
.prep-chk-btn.done{background:var(--sage);border-color:var(--sage);}
.prep-task-body{display:none;border-top:1px solid var(--warm-dark);padding:12px 14px;}
.prep-task.open .prep-task-body{display:block;}
.prep-paso{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
.prep-paso:last-child{margin-bottom:0;}
.prep-paso-num{width:20px;height:20px;border-radius:50%;background:#fff8ee;border:1.5px solid #f0d9b5;color:#a0622a;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.prep-paso-txt{font-size:13px;line-height:1.5;color:var(--text);}
.prep-resultado{margin-top:10px;background:var(--sage-pale);border:1px solid var(--sage-light);border-radius:var(--rad-xs);padding:10px 12px;font-size:12px;color:var(--sage);font-weight:600;line-height:1.5;}


/* ─── ROTADOR ─── */
.rot-hero{display:flex;align-items:flex-start;gap:12px;background:linear-gradient(135deg,#f0f7ff,#fff);border:1px solid #c8dff5;border-radius:var(--rad);padding:14px 16px;margin-bottom:14px;}
.rot-hero-ico{font-size:32px;flex-shrink:0;}
.rot-hero-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:3px;}
.rot-hero-sub{font-size:12px;color:var(--text-sec);line-height:1.4;}
.rot-section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--text-sec);margin-bottom:8px;}
.rot-prot-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.rot-prot-chip{background:var(--card);border:1.5px solid var(--card-border);border-radius:99px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--text-sec);cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent;}
.rot-prot-chip.act{background:var(--sage-pale);border-color:var(--sage-light);color:var(--sage);}
.rot-btn-generar{width:100%;padding:14px;background:linear-gradient(135deg,var(--sage),var(--sage-mid));color:#fff;border:none;border-radius:var(--rad-sm);font-family:var(--font);font-size:15px;font-weight:800;cursor:pointer;margin-bottom:16px;letter-spacing:.2px;}
.rot-plan-preview{background:var(--card);border:1px solid var(--card-border);border-radius:var(--rad);overflow:hidden;margin-bottom:16px;}
.rot-plan-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--warm-dark);background:var(--sage-ultra);}
.rot-plan-title{font-size:14px;font-weight:800;color:var(--sage);}
.rot-aplicar-btn{background:var(--sage);color:#fff;border:none;border-radius:99px;padding:7px 14px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;}
.rot-sem-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--text-ter);padding:8px 14px 4px;background:var(--warm-dark);}
.rot-dia-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--warm-dark);}
.rot-dia-row:last-child{border-bottom:none;}
.rot-dia-num{width:24px;height:24px;border-radius:8px;background:var(--sage-pale);color:var(--sage);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.rot-dia-nombre{font-size:13px;font-weight:700;margin-bottom:4px;}
.rot-dia-comidas{display:flex;flex-direction:column;gap:3px;}
.rot-chip{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:600;display:inline-block;}
.rot-chip.desayuno{background:var(--orange-pale);color:var(--orange);}
.rot-chip.cena{background:var(--blue-pale);color:var(--blue);}
.rot-compras-preview{padding:12px 14px;background:var(--sage-ultra);border-top:1px solid var(--warm-dark);}
.rot-compras-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--sage);margin-bottom:8px;}
.rot-compras-items{display:flex;flex-direction:column;gap:5px;}
.rot-compra-tag{font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;}
.rot-compra-tag.fijo{background:var(--sage-pale);color:var(--sage);}
.rot-compra-tag.nuevo{background:#fff8ee;color:#a0622a;border:1px solid #f0d9b5;}

/* ─── SECTION EMPTY ─── */
.empty{text-align:center;padding:48px 20px;color:var(--text-ter);}

// ══════════════════════════════════════════
// TABS
// ══════════════════════════════════════════
let tab=0;
function swTab(i){
  tab=i;
  ['panel-plan','panel-prep','panel-rotador','panel-compras'].forEach((id,x)=>{
    document.getElementById(id).classList.toggle('act',x===i);
  });
  [0,1,2,3].forEach(x=>{
    document.getElementById('bnav-'+x).classList.toggle('act',x===i);
  });
  const sp=document.getElementById('semana-pill');
  const ps=document.getElementById('prog-strip');
  sp.style.display=i===0?'flex':'none';
  ps.style.display=i===0?'flex':'none';
  const subs={0:`Semana ${E.semana} · Plan quincenal`,1:'Prep del domingo',2:'Cambiar quincena',3:'Lista de compras'};
  document.getElementById('header-sub').textContent=subs[i];
  if(i===2) renderRotador();
}

// ══════════════════════════════════════════
// SEMANA
// ══════════════════════════════════════════
function setSemana(s){
  E.semana=s;saveE();
  document.querySelectorAll('.hpill-btn').forEach((b,i)=>b.classList.toggle('act',i+1===s));
  document.getElementById('header-sub').textContent=`Semana ${s} · Plan quincenal`;
  renderPlan();
}

function renderPlan(){
  const dias=PLAN.filter(d=>d.s===E.semana);
  let html='';
  dias.forEach(dia=>{
    const doneCount=dia.comidas.filter((_,ci)=>E.done[`s${dia.s}_d${dia.n}_c${ci}`]).length;
    const isOpen=!!E.diasOpen[`s${dia.s}_d${dia.n}`];
    const isCompleto=doneCount===dia.comidas.length;
    const dots=dia.comidas.map((_,ci)=>{
      const k=`s${dia.s}_d${dia.n}_c${ci}`;
      return `<div class="dia-dot ${E.done[k]?'done':''}"></div>`;
    }).join('');
    html+=`<div class="dia-card ${isOpen?'open':''}" id="dcard-s${dia.s}d${dia.n}">
      <div class="dia-header" onclick="toggleDia('s${dia.s}d${dia.n}')">
        <div class="dia-num ${isCompleto?'completo':''}">${isCompleto?'✓':dia.n}</div>
        <div class="dia-info">
          <div class="dia-nombre">${dia.dia}</div>
          <div class="dia-progress">${dots}</div>
        </div>
        <div class="dia-chevron">›</div>
      </div>
      <div class="dia-body">`;
    dia.comidas.forEach((c,ci)=>{
      const k=`s${dia.s}_d${dia.n}_c${ci}`;
      const done=!!E.done[k];
      html+=`<div class="comida-row ${done?'done':''}" id="crow-${k}">
        <div class="comida-tipo-bar ${c.tipo}"></div>
        <div class="comida-content" onclick="abrirReceta('${c.r}')">
          <div class="comida-tipo-label ${c.tipo}">${c.tipo==='desayuno'?'🌅 Desayuno':'🌙 Cena'}</div>
          <div class="comida-nombre">${c.nombre}</div>
          ${c.tip?`<div class="comida-tip">💡 ${c.tip}</div>`:''}
        </div>
        <div class="comida-actions">
          <button class="btn-receta-pill" onclick="abrirReceta('${c.r}')">Receta</button>
          <button class="btn-check ${done?'done':''}" id="chk-${k}" onclick="toggleDone('${k}','s${dia.s}d${dia.n}',event)">${done?'✓':''}</button>
        </div>
      </div>`;
    });
    html+=`</div></div>`;
  });
  document.getElementById('plan-contenido').innerHTML=html;
  actualizarProgreso();
}

function toggleDia(key){
  E.diasOpen[key]=!E.diasOpen[key];
  saveE();
  const card=document.getElementById('dcard-'+key);
  card.classList.toggle('open',!!E.diasOpen[key]);
}

function toggleDone(k,dkey,ev){
  ev.stopPropagation();
  E.done[k]=!E.done[k];
  saveE();
  const done=E.done[k];
  const row=document.getElementById('crow-'+k);
  const btn=document.getElementById('chk-'+k);
  row.classList.toggle('done',done);
  btn.classList.toggle('done',done);
  btn.textContent=done?'✓':'';
  // Update dia dots
  const parts=k.split('_');
  const s=parseInt(parts[0].slice(1));
  const n=parseInt(parts[1].slice(1));
  const dia=PLAN.find(d=>d.s===s&&d.n===n);
  if(dia){
    const card=document.getElementById('dcard-'+dkey);
    const dots=card.querySelectorAll('.dia-dot');
    const numEl=card.querySelector('.dia-num');
    dia.comidas.forEach((_,ci)=>{
      const dk=`s${s}_d${n}_c${ci}`;
      if(dots[ci])dots[ci].classList.toggle('done',!!E.done[dk]);
    });
    const allDone=dia.comidas.every((_,ci)=>E.done[`s${s}_d${n}_c${ci}`]);
    numEl.classList.toggle('completo',allDone);
    numEl.textContent=allDone?'✓':n;
  }
  actualizarProgreso();
  if(done)toast('¡Listo! 🍽️','ok');
}

function actualizarProgreso(){
  const total=PLAN.filter(d=>d.s===E.semana).reduce((a,d)=>a+d.comidas.length,0);
  const done=PLAN.filter(d=>d.s===E.semana).reduce((a,d)=>{
    return a+d.comidas.filter((_,ci)=>E.done[`s${d.s}_d${d.n}_c${ci}`]).length;
  },0);
  document.getElementById('prog-fill').style.width=(done/total*100)+'%';
  document.getElementById('prog-label').textContent=`${done} / ${total} comidas`;
}

function abrirReceta(key){
  const r=RECETAS[key];if(!r)return;
  document.getElementById('modal-emoji').textContent=r.emoji;
  document.getElementById('modal-titulo').textContent=r.nombre;
  document.getElementById('modal-tipo').textContent=r.tipo;
  let b=`<div class="sheet-section"><div class="sheet-section-title">Ingredientes</div><div class="ing-grid">`;
  r.ingredientes.forEach(i=>{b+=`<div class="ing-row"><span class="ing-nombre">${i.n}</span><span class="ing-qty">${i.q}</span></div>`;});
  b+=`</div></div><div class="sheet-divider" style="margin:14px 0 0;"></div>`;
  b+=`<div class="sheet-section"><div class="sheet-section-title">Preparación</div><div class="steps-list">`;
  r.pasos.forEach((p,i)=>{b+=`<div class="step-row"><div class="step-num-circle">${i+1}</div><div class="step-text">${p}</div></div>`;});
  b+=`</div></div><div class="sheet-divider" style="margin:14px 0 0;"></div>`;
  b+=`<div class="sheet-section" style="padding-bottom:8px;"><div class="sheet-section-title">Conservación ❄️</div><div class="conserva-card"><strong>Cómo guardar</strong>${r.conservacion}</div></div>`;
  document.getElementById('modal-body').innerHTML=b;
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('receta-sheet').scrollTop=0;
}
function cerrarModal(){document.getElementById('modal-overlay').classList.remove('open');}
document.getElementById('modal-overlay').addEventListener('click',function(e){if(e.target===this)cerrarModal();});

function renderCompras(){
  const cont=document.getElementById('compras-contenido');
  let html='';let total=0;
  COMPRAS.forEach(sec=>{
    html+=`<div class="compra-seccion"><div class="compra-sec-title">${sec.sec}</div>`;
    sec.items.forEach(item=>{
      total++;
      const done=!!E.compras[item.id];
      html+=`<div class="compra-item ${done?'done':''}" id="cpitem-${item.id}" onclick="toggleCompra('${item.id}')">
        <div class="ci-chk ${done?'done':''}" id="cpchk-${item.id}">${done?'✓':''}</div>
        <div class="ci-nombre">${item.n}</div>
        <div class="ci-qty">${item.q}</div>
      </div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('cr-total').textContent=total;
  cont.innerHTML=html;
  actualizarCompras();
}
function toggleCompra(id){
  E.compras[id]=!E.compras[id];saveE();
  const done=E.compras[id];
  document.getElementById('cpitem-'+id).classList.toggle('done',done);
  const chk=document.getElementById('cpchk-'+id);
  chk.classList.toggle('done',done);
  chk.textContent=done?'✓':'';
  actualizarCompras();
}
function actualizarCompras(){
  const total=COMPRAS.reduce((a,s)=>a+s.items.length,0);
  const done=Object.values(E.compras).filter(Boolean).length;
  document.getElementById('cr-marcados').textContent=done;
  document.getElementById('cr-falta').textContent=total-done;
  document.getElementById('cr-total').textContent=total;
}

let tt;
function toast(m,t=''){
  const el=document.getElementById('toast');
  el.textContent=m;el.className='show '+(t==='ok'?'ok':'');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2200);
}

function renderPrep(){
  const cont = document.getElementById('prep-contenido');
  let html = '';
  PREP_TASKS.forEach((t,i)=>{
    const done = !!E.prep[t.id];
    const isOpen = !!E.prepOpen[t.id];
    const tags = t.tags.map(tg=>`<span class="prep-meta-chip ${tg.cls}">${tg.label}</span>`).join('');
    const pasos = t.pasos.map((p,pi)=>`<div class="prep-paso"><div class="prep-paso-num">${pi+1}</div><div class="prep-paso-txt">${p}</div></div>`).join('');
    html += `<div class="prep-task ${done?'done-task':''}" id="ptask-${t.id}">
      <div class="prep-task-header" id="phdr-${t.id}">
        <div class="prep-order" id="pord-${t.id}">${done?'✓':(i+1)}</div>
        <div class="prep-task-info">
          <div class="prep-task-nombre">${t.nombre}</div>
          <div class="prep-task-meta">
            <span class="prep-meta-chip listo">⏱ ${t.tiempo}</span>
            ${tags}
          </div>
        </div>
        <button class="prep-chk-btn ${done?'done':''}" id="pchk-${t.id}">✓</button>
      </div>
      <div class="prep-task-body" id="pbdy-${t.id}" style="display:${isOpen?'block':'none'};">
        ${pasos}
        <div class="prep-resultado">${t.resultado}</div>
      </div>
    </div>`;
  });
  cont.innerHTML = html;

  // Attach event listeners after render
  PREP_TASKS.forEach((t,i)=>{
    const hdr = document.getElementById('phdr-'+t.id);
    const chk = document.getElementById('pchk-'+t.id);
    const bdy = document.getElementById('pbdy-'+t.id);
    const task = document.getElementById('ptask-'+t.id);

    // Header click = toggle body open/close
    hdr.addEventListener('click', function(ev){
      if(ev.target===chk || chk.contains(ev.target)) return;
      const open = bdy.style.display==='block';
      bdy.style.display = open?'none':'block';
      E.prepOpen[t.id] = !open;
      saveE();
    });

    // Check button = mark done
    chk.addEventListener('click', function(ev){
      ev.stopPropagation();
      E.prep[t.id] = !E.prep[t.id];
      saveE();
      const done = E.prep[t.id];
      task.classList.toggle('done-task', done);
      chk.classList.toggle('done', done);
      const ord = document.getElementById('pord-'+t.id);
      ord.textContent = done?'✓':(i+1);
      // Titulo tachado
      const nom = task.querySelector('.prep-task-nombre');
      nom.style.textDecoration = done?'line-through':'';
      nom.style.color = done?'var(--text-ter)':'';
      actualizarPrepProg();
      if(done) toast('¡Listo! 💪','ok');
    });
  });

  actualizarPrepProg();
}

function togglePrepTask(id){
  E.prepOpen[id] = !E.prepOpen[id];
  saveE();
  document.getElementById('ptask-'+id).classList.toggle('open', !!E.prepOpen[id]);
}

function togglePrepDone(id, ev){
  ev.stopPropagation();
  E.prep[id] = !E.prep[id];
  saveE();
  const done = E.prep[id];
  const task = document.getElementById('ptask-'+id);
  const btn = document.getElementById('pchk-'+id);
  const order = task.querySelector('.prep-order');
  const idx = PREP_TASKS.findIndex(t=>t.id===id);
  task.classList.toggle('done-task', done);
  btn.classList.toggle('done', done);
  btn.textContent = done?'✓':'';
  order.textContent = done?'✓':(idx+1);
  actualizarPrepProg();
  if(done) toast('¡Listo! 💪','ok');
}

function actualizarPrepProg(){
  const total = PREP_TASKS.length;
  const done = Object.values(E.prep).filter(Boolean).length;
  document.getElementById('prep-fill').style.width=(done/total*100)+'%';
  document.getElementById('prep-prog-txt').textContent=`${done} / ${total}`;
}

function resetPrep(){
  if(!confirm('¿Reiniciar el prep para una nueva quincena?')) return;
  E.prep={};E.prepOpen={};
  saveE();
  renderPrep();
  toast('Prep reiniciado 🔄');
}

  {key:'atun',          label:'Atún con tomate 🐟',    comp:'atun'},
  {key:'atun_queso',    label:'Atún + queso 🐟',       comp:'atun'},
  {key:'sardinas',      label:'Sardinas con brócoli 🐟',comp:'sardinas'},
  {key:'sardinas_tomate',label:'Sardinas + tomate 🐟', comp:'sardinas'},
  {key:'lenteja',       label:'Menestra de lenteja 🫘', comp:'lenteja'},
  {key:'lenteja_huevo', label:'Lenteja + huevo 🫘',    comp:'lenteja'},
  {key:'huevos_duros',  label:'Huevos duros + queso 🥚',comp:null},
  {key:'carne_plancha', label:'Carne a la plancha 🥩',   comp:'carne'},
  {key:'carne_frita',   label:'Carne frita 🥩',           comp:'carne'},
];
// Carbohidratos de cena
const POOL_CARBO_CENA = ['platano_sancocho','platano_asado'];

// Compras base que SIEMPRE van (no cambian)
const COMPRAS_BASE = [
  {sec:"🥚 Proteínas base",items:[
    {id:"huevos",n:"Huevos",q:"15 unidades"},
  ]},
  {sec:"🍌 Carbohidratos",items:[
    {id:"p_verde",n:"Plátano verde",q:"8 unidades"},
    {id:"guineo",n:"Guineos",q:"1 racimo pequeño"},
  ]},
  {sec:"🥦 Verduras y frutas",items:[
    {id:"zanahoria",n:"Zanahoria",q:"6 unidades"},
    {id:"tomate",n:"Tomate",q:"4 unidades"},
    {id:"manzana",n:"Manzana",q:"6 unidades"},
    {id:"limon",n:"Limones",q:"10 unidades"},
  ]},
  {sec:"🌾 Desayuno base",items:[
    {id:"avena",n:"Avena en hojuelas",q:"500g"},
    {id:"pan",n:"Pan integral",q:"1 funda"},
    {id:"mani",n:"Mantequilla de maní",q:"1 frasco pequeño"},
    {id:"yogur",n:"Yogur natural",q:"2 vasitos"},
  ]},
  {sec:"🧴 Extras",items:[
    {id:"aceite",n:"Aceite vegetal",q:"250ml"},
    {id:"condi",n:"Sal / pimienta / orégano",q:"c/n"},
  ]},
];

// Proteínas opcionales según selección
const COMPRAS_PROTEINAS = {
  pollo:    {id:"pollo",    n:"Pechuga de pollo",  q:"500g"},
  atun:     {id:"atun",     n:"Atún en lata",       q:"4 latas"},
  sardinas: {id:"sardinas", n:"Sardinas en lata",   q:"2 latas"},
  lenteja:  {id:"lenteja",  n:"Lenteja seca",       q:"500g"},
  brocoli:  {id:"brocoli",  n:"Brócoli",            q:"1 cabeza pequeña"},
  carne:    {id:"carne",    n:"Carne de res",        q:"500g (en porciones de 125g)"},
};

// ══════════════════════════════════════════
// ROTADOR: RENDER Y LÓGICA
// ══════════════════════════════════════════
function renderRotador(){
  const cont = document.getElementById('rotador-contenido');
  if(!cont) return;

  // Leer selecciones guardadas
  const sel = E.rotador || {};

  // Proteínas seleccionadas (máx 3 para no complicar la compra)
  const protSelec = sel.proteinas || ['pollo_plancha','atun','lenteja','sardinas'];

  let html = '';

  // Hero
  html += `<div class="rot-hero">
    <div class="rot-hero-ico">🔄</div>
    <div>
      <div class="rot-hero-title">Generador de quincena</div>
      <div class="rot-hero-sub">Elige tus proteínas y genera un plan nuevo. Los desayunos y carbohidratos se rotan solos.</div>
    </div>
  </div>`;

  // Selector de proteínas
  html += `<div class="rot-section-title">Elige tus proteínas para esta quincena</div>`;
  html += `<div class="rot-prot-grid">`;
  POOL_PROTEINAS_CENA.forEach(p=>{
    const act = protSelec.includes(p.key);
    html += `<div class="rot-prot-chip ${act?'act':''}" id="rprot-${p.key}" onclick="toggleProtSelec('${p.key}')">
      ${p.label}
    </div>`;
  });
  html += `</div>`;

  // Botón generar
  html += `<button class="rot-btn-generar" onclick="generarQuincena()">✨ Generar nueva quincena</button>`;

  // Preview del plan generado
  if(sel.planGenerado){
    html += renderPlanGenerado(sel.planGenerado);
  }

  cont.innerHTML = html;
}

function toggleProtSelec(key){
  if(!E.rotador) E.rotador={};
  if(!E.rotador.proteinas) E.rotador.proteinas=['pollo_plancha','atun','lenteja','sardinas'];
  const idx = E.rotador.proteinas.indexOf(key);
  if(idx>=0){
    if(E.rotador.proteinas.length<=2){toast('Selecciona al menos 2 proteínas','');return;}
    E.rotador.proteinas.splice(idx,1);
  } else {
    E.rotador.proteinas.push(key);
  }
  saveE();
  const chip = document.getElementById('rprot-'+key);
  if(chip) chip.classList.toggle('act', E.rotador.proteinas.includes(key));
}

function generarQuincena(){
  if(!E.rotador) E.rotador={};
  const protDisp = (E.rotador.proteinas||['pollo_plancha','atun','lenteja','sardinas']).slice();

  // Shuffle helper
  const shuffle = arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

  const plan = [];
  // Desayunos rotados uniformemente
  const desShuf = shuffle([...POOL_DESAYUNOS,...POOL_DESAYUNOS]).slice(0,14);
  // Proteínas cena rotadas
  const protPool = [];
  while(protPool.length<14) protPool.push(...shuffle(protDisp));
  const protShuf = protPool.slice(0,14);
  // Carbohidratos
  const carboPool = [];
  while(carboPool.length<14) carboPool.push(...shuffle(POOL_CARBO_CENA));
  const carboShuf = carboPool.slice(0,14);

  for(let i=0;i<14;i++){
    const semana = i<7?1:2;
    const diaIdx = i%7;
    const protKey = protShuf[i];
    const protObj = POOL_PROTEINAS_CENA.find(p=>p.key===protKey);
    const carboKey = carboShuf[i];
    const carboObj = BANCO_RECETAS[carboKey];
    plan.push({
      semana, dia:DIAS_SEMANA[diaIdx], num:i+1,
      desayuno:{key:desShuf[i], nombre:BANCO_RECETAS[desShuf[i]]?.nombre||desShuf[i]},
      cena:{
        proteina:{key:protKey, nombre:protObj?.label||protKey},
        carbo:{key:carboKey, nombre:carboObj?.nombre||carboKey}
      }
    });
  }

  // Calcular lista de compras dinámica
  const protUsadas = new Set(protShuf.map(k=>POOL_PROTEINAS_CENA.find(p=>p.key===k)?.comp).filter(Boolean));
  // Si hay brócoli en alguna cena de sardinas, agregar brócoli
  const usaBrocoli = protShuf.some(k=>k==='sardinas');
  if(usaBrocoli) protUsadas.add('brocoli');

  E.rotador.planGenerado = plan;
  E.rotador.comprasGeneradas = [...protUsadas];
  saveE();
  renderRotador();
  toast('¡Nueva quincena generada! ✨','ok');
}

function renderPlanGenerado(plan){
  let html = `<div class="rot-plan-preview">
    <div class="rot-plan-header">
      <div class="rot-plan-title">Tu nueva quincena</div>
      <button class="rot-aplicar-btn" onclick="aplicarPlanGenerado()">Aplicar este plan →</button>
    </div>`;

  [1,2].forEach(sem=>{
    html += `<div class="rot-sem-label">Semana ${sem}</div>`;
    plan.filter(d=>d.semana===sem).forEach(d=>{
      html += `<div class="rot-dia-row">
        <div class="rot-dia-num">${d.num}</div>
        <div class="rot-dia-info">
          <div class="rot-dia-nombre">${d.dia}</div>
          <div class="rot-dia-comidas">
            <span class="rot-chip desayuno">🌅 ${d.desayuno.nombre}</span>
            <span class="rot-chip cena">🌙 ${d.cena.proteina.nombre} + ${d.cena.carbo.nombre}</span>
          </div>
        </div>
      </div>`;
    });
  });

  // Lista de compras generada
  html += `<div class="rot-compras-preview">
    <div class="rot-compras-title">📦 Lo que necesitas comprar</div>
    <div class="rot-compras-items">`;
  // Base siempre
  html += `<div class="rot-compra-tag fijo">✅ Mismos de siempre (avena, pan, maní, yogur, huevos, plátanos, verduras)</div>`;
  // Proteínas variables
  const compP = E.rotador?.comprasGeneradas||[];
  compP.forEach(comp=>{
    const item = COMPRAS_PROTEINAS[comp];
    if(item) html += `<div class="rot-compra-tag nuevo">+ ${item.n} — ${item.q}</div>`;
  });
  html += `</div></div>`;

  html += `</div>`;
  return html;
}

function aplicarPlanGenerado(){
  if(!E.rotador?.planGenerado){return;}
  if(!confirm('¿Aplicar este plan? Se reemplaza el plan actual y se reinician los chequeos.')) return;

  // Convertir plan generado al formato de PLAN
  const nuevoPlan = E.rotador.planGenerado.map(d=>({
    s: d.semana,
    dia: d.dia,
    n: d.num,
    comidas:[
      {tipo:'desayuno', nombre: BANCO_RECETAS[d.desayuno.key]?.nombre||d.desayuno.nombre, r: d.desayuno.key, tip:null},
      {tipo:'cena', nombre: (BANCO_RECETAS[d.cena.proteina.key]?.nombre||d.cena.proteina.nombre)+' + '+(BANCO_RECETAS[d.cena.carbo.key]?.nombre||d.cena.carbo.nombre), r: d.cena.proteina.key, tip:null},
    ]
  }));

  // Actualizar PLAN global
  PLAN.length=0;
  nuevoPlan.forEach(d=>PLAN.push(d));

  // Actualizar COMPRAS con proteínas nuevas
  const compP = E.rotador.comprasGeneradas||[];
  // Rebuild compras
  COMPRAS.length=0;
  COMPRAS_BASE.forEach(s=>COMPRAS.push(JSON.parse(JSON.stringify(s))));
  // Agregar sección proteínas
  const protItems = compP.map(comp=>COMPRAS_PROTEINAS[comp]).filter(Boolean);
  if(protItems.length){
    COMPRAS.unshift({sec:"🥚 Proteínas",items:protItems});
  }

  // Reset estado
  E.done={};E.diasOpen={};E.compras={};
  saveE();
  swTab(0);
  renderPlan();
  renderCompras();
  toast('¡Plan aplicado! 🎉','ok');
}

</script>
